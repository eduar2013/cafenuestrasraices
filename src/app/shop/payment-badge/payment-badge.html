<div class="payment-badge">
  <svg class="lock" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
    <rect x="5" y="10.5" width="14" height="10" rx="2.2" fill="currentColor" />
    <path
      d="M8 10.5V8a4 4 0 0 1 8 0v2.5"
      fill="none"
      stroke="currentColor"
      stroke-width="1.9"
      stroke-linecap="round"
    />
  </svg>
  <span class="badge-text">
    <span class="badge-title">
      Pago seguro con
      @if (logoMissing()) {
        <strong class="wompi-name">Wompi</strong>
      } @else {
        <img class="wompi-logo" [src]="logo" alt="Wompi" (error)="logoMissing.set(true)" />
      }
    </span>
    @if (!compact()) {
      <span class="badge-detail">
        Tarjetas, PSE, Nequi y más. Tus datos de pago no pasan por esta tienda.
      </span>
    }
  </span>
</div>
