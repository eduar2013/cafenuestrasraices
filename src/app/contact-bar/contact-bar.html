<section class="quick-contact-bar" aria-label="Canales de contacto y redes sociales">
  <div class="quick-contact-group">
    <a
      class="brand"
      routerLink="/"
      fragment="inicio"
      aria-label="Café Nuestras Raíces, ir al inicio"
    >
      <!-- Shop logo from the round sign: ring, coffee plant and the bean it grows from. -->
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="22.6" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path
          d="M7.6 31A17.2 17.2 0 0 1 36.6 11.8"
          fill="none"
          stroke="currentColor"
          stroke-width="1.1"
          stroke-linecap="round"
        />
        <g transform="translate(24 25) scale(1.16) translate(-24 -25)">
          <g fill="currentColor">
            <path
              transform="translate(24.2 28.5) rotate(200) scale(1)"
              d="M0 0C2.2-3 6.6-3.2 9 0C6.6 3.2 2.2 3 0 0Z"
            />
            <path
              transform="translate(24.9 21.5) rotate(208) scale(0.95)"
              d="M0 0C2.2-3 6.6-3.2 9 0C6.6 3.2 2.2 3 0 0Z"
            />
            <path
              transform="translate(25.2 14.6) rotate(232) scale(0.8)"
              d="M0 0C2.2-3 6.6-3.2 9 0C6.6 3.2 2.2 3 0 0Z"
            />
            <path
              transform="translate(24.6 25) rotate(-22) scale(0.95)"
              d="M0 0C2.2-3 6.6-3.2 9 0C6.6 3.2 2.2 3 0 0Z"
            />
            <path
              transform="translate(25.1 18) rotate(-30) scale(0.85)"
              d="M0 0C2.2-3 6.6-3.2 9 0C6.6 3.2 2.2 3 0 0Z"
            />
            <path
              transform="translate(25.3 12) rotate(-72) scale(0.6)"
              d="M0 0C2.2-3 6.6-3.2 9 0C6.6 3.2 2.2 3 0 0Z"
            />
            <g transform="translate(24 37.3) rotate(-8) scale(2.05)">
              <path
                d="M-2.1 -.15A2.1 1.4 0 0 1 2.1 -.15C1.2 -.75.6 -.65 0 -.15S-1.2.45-2.1 -.15Z"
              />
              <path d="M2.1 .2A2.1 1.4 0 0 1 -2.1 .2C-1.2.8-.6.7 0 .2S1.2-.4 2.1 .2Z" />
            </g>
          </g>
          <path
            d="M24 34.4C23.2 28.5 26 22 25.3 11"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </g>
      </svg>
      <span class="brand-text">
        <span class="brand-eyebrow">Café</span>
        <span class="brand-name">Nuestras Raíces</span>
      </span>
    </a>
  </div>

  <div class="quick-actions">
    @if (showShopLink()) {
      <a class="shop-cta" routerLink="/tienda">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 7h12l-1 13H7L6 7Zm3 0V6a3 3 0 0 1 6 0v1" />
        </svg>
        <span>Visita la tienda</span>
        <span class="shop-cta-arrow" aria-hidden="true">→</span>
      </a>
    }

    <div class="quick-social-group" aria-label="Redes sociales">
      <a
        class="social-link"
        href="https://www.facebook.com/profile.php?id=61590567255629"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M13.5 8.5V6.7c0-.6.4-1 1-1h1.5V3h-2.6c-2.4 0-3.9 1.6-3.9 4v1.5H7v3h2.5V21h4v-9.5H16l.4-3h-2.9z"
          />
        </svg>
      </a>
      <a
        class="social-link"
        href="https://www.instagram.com/cafenuestrasraices"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M7.5 3h9A4.5 4.5 0 0 1 21 7.5v9a4.5 4.5 0 0 1-4.5 4.5h-9A4.5 4.5 0 0 1 3 16.5v-9A4.5 4.5 0 0 1 7.5 3zm0 1.8A2.7 2.7 0 0 0 4.8 7.5v9a2.7 2.7 0 0 0 2.7 2.7h9a2.7 2.7 0 0 0 2.7-2.7v-9a2.7 2.7 0 0 0-2.7-2.7h-9zm9.7 1.4a1 1 0 1 1 0 2 1 1 0 0 1 0-2zM12 7.8a4.2 4.2 0 1 1 0 8.4 4.2 4.2 0 0 1 0-8.4zm0 1.8a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8z"
          />
        </svg>
      </a>
      <a
        class="social-link"
        href="https://wa.me/573207803402"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="WhatsApp"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M19 5a9.9 9.9 0 0 0-16.8 7.2c0 1.7.4 3.3 1.2 4.7L2 22l5.2-1.4a9.9 9.9 0 0 0 4.7 1.2A10 10 0 0 0 19 5zm-7.1 15a8.1 8.1 0 0 1-4.1-1.1l-.3-.2-3.1.9.8-3-.2-.3A8.2 8.2 0 1 1 11.9 20zm4.5-6.1c-.2-.1-1.2-.6-1.4-.7-.2-.1-.3-.1-.4.1s-.5.7-.6.8c-.1.1-.2.1-.4 0a6.8 6.8 0 0 1-2-1.2 7.7 7.7 0 0 1-1.4-1.8c-.1-.2 0-.3.1-.4l.3-.3c.1-.1.1-.2.2-.3v-.3c0-.1-.4-1-.6-1.4-.2-.4-.3-.4-.4-.4h-.4c-.1 0-.3.1-.5.3s-.7.7-.7 1.7.8 2 1 2.1c.1.1 1.4 2.2 3.5 3 .5.2 1 .4 1.3.6.5.1 1 .1 1.4.1.4-.1 1.2-.5 1.3-1 .2-.5.2-1 .1-1-.1 0-.2-.1-.4-.2z"
          />
        </svg>
      </a>
      <app-side-nav />
    </div>
  </div>
</section>
