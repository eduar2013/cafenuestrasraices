<div class="side-nav" (keydown.escape)="close(); toggleButton.focus(); $event.stopPropagation()">
  <button
    #toggleButton
    class="nav-toggle"
    type="button"
    [attr.aria-expanded]="isOpen()"
    aria-controls="side-nav-links"
    [attr.aria-label]="isOpen() ? 'Cerrar menú' : 'Abrir menú'"
    (click)="toggle()"
  >
    <svg
      aria-hidden="true"
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
    >
      @if (isOpen()) {
        <path d="m6 6 12 12M6 18 18 6" />
      } @else {
        <path d="M4 6h16M4 12h16M4 18h16" />
      }
    </svg>
  </button>
  <nav id="side-nav-links" aria-label="Navegación por secciones" [hidden]="!isOpen()">
    <ul>
      <li>
        <a routerLink="/" fragment="inicio" aria-label="Inicio" title="Inicio" (click)="close()">
          Inicio
        </a>
      </li>
      <li>
        <a
          routerLink="/"
          fragment="historia"
          aria-label="Historia"
          title="Historia"
          (click)="close()"
        >
          Historia
        </a>
      </li>
      <li>
        <a
          routerLink="/"
          fragment="productos"
          aria-label="Productos"
          title="Productos"
          (click)="close()"
        >
          Productos
        </a>
      </li>
      <li>
        <a
          routerLink="/"
          fragment="origenes"
          aria-label="Orígenes del café"
          title="Orígenes del café"
          (click)="close()"
        >
          Orígenes
        </a>
      </li>
      <li>
        <a routerLink="/tienda" aria-label="Tienda" title="Tienda" (click)="close()">Tienda</a>
      </li>
      <li>
        <a
          routerLink="/"
          fragment="ubicacion"
          aria-label="Ubicación y horarios"
          title="Ubicación y horarios"
          (click)="close()"
        >
          Ubicación
        </a>
      </li>
    </ul>
  </nav>
</div>
